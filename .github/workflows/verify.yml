name: verify

on:
  push:
    branches: [main]
  pull_request:

# The same command a developer runs locally, on both platforms this repository is
# used on: the client bundle is a classic script and the plugin runs inside the
# desktop harness, so a Windows-only or POSIX-only pass would be half a result.
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
